<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GET INSPIRED — Restructure Exploration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600;1,700;1,900&family=Manrope:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body), system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background 320ms ease, color 320ms ease;
    }
    ::selection { background: var(--accent); color: var(--bg); }
    .display { font-family: var(--font-display), serif; font-weight: 400; }
    .ital { font-style: italic; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .eyebrow {
      font-family: var(--font-body), sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink-2);
    }
    .hairline { border: 0; border-top: 0.5px solid var(--rule); margin: 0; }
    a { color: inherit; }
    button { font: inherit; }

    /* Placeholder image */
    .ph {
      position: relative;
      background:
        repeating-linear-gradient(135deg, var(--ph-stripe) 0 1px, transparent 1px 8px),
        var(--ph-bg);
      color: var(--ink-2);
      overflow: hidden;
    }
    .ph::after {
      content: attr(data-label);
      position: absolute;
      left: 14px; bottom: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
      opacity: 0.7;
    }

    /* Hide scrollbars on body but keep scrolling */
    html, body { scroll-behavior: smooth; }

    /* ─── Responsive helpers ─── */
    /* Tablet and below */
    @media (max-width: 960px) {
      .r-split { grid-template-columns: 1fr !important; }
      .r-split-img { min-height: 60vh !important; max-height: 60vh; }
      .r-agenda-row {
        grid-template-columns: 36px 1fr !important;
        row-gap: 14px !important;
      }
      .r-agenda-row > :nth-child(3),
      .r-agenda-row > :nth-child(4) {
        grid-column: 2 !important;
      }
      .r-agenda-row > :nth-child(4) {
        align-items: flex-start !important;
        text-align: left !important;
      }
      .r-invite-grid { grid-template-columns: 1fr !important; }
      .r-invite-side { position: static !important; }
      .r-opps-grid { grid-template-columns: 1fr 1fr !important; }
    }
    /* Phone */
    @media (max-width: 640px) {
      .r-grid-2 { grid-template-columns: 1fr !important; }
      .r-grid-4 { grid-template-columns: 1fr 1fr !important; }
      .r-field-row { grid-template-columns: 1fr !important; }
      .r-hero-cta-row {
        grid-template-columns: 1fr !important;
        gap: 18px !important;
      }
      .r-hero-cta-row > a { width: 100%; justify-content: center; }
      .r-hero-nav-cta { display: none !important; }
      .r-footer { grid-template-columns: 1fr !important; align-items: start !important; }
      .r-eyebrow-line > span { display: inline-block; }
      .r-agenda-meta { align-items: flex-start !important; text-align: left !important; }
      .r-section-pad-y { padding-top: 56px !important; padding-bottom: 56px !important; }
      .r-week-grid { grid-template-columns: 1fr !important; }
      .r-opps-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body style="background-color: rgb(154, 114, 53)">
  <div id="root"></div>

  <script>
    // Persisted defaults (host writes back through the EDITMODE markers)
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "variation": "A",
      "palette": "ivory",
      "typePairing": "editorial",
      "heroTreatment": "cover",
      "density": "regular",
      "showGrid": false
    }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="riviera.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
